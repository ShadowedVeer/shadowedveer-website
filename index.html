      return /admin(\.html)?$/i.test(p) || location.hash === "#admin" || /(?:\?|&)admin(?:=1)?(?:&|$)/.test(location.search);
    }
    function ytId(raw) {
      const v = (raw || "").trim();
      if (/^[\w-]{11}$/.test(v)) return v;
      try {
        const u = new URL(v);
        const h = u.hostname.replace(/^www\./, "").replace(/^m\./, "");
        if (h === "youtu.be") { const id = u.pathname.split("/").filter(Boolean)[0]; return /^[\w-]{11}$/.test(id) ? id : null; }
        if (h.endsWith("youtube.com") || h === "music.youtube.com") {
          const q = u.searchParams.get("v"); if (q && /^[\w-]{11}$/.test(q)) return q;
          const parts = u.pathname.split("/").filter(Boolean);
          if (["embed","shorts","live","v"].includes(parts[0]) && /^[\w-]{11}$/.test(parts[1] || "")) return parts[1];
        }
      } catch {}
      return null;
    }
    function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&","<":"<",">":">",'"':""","'":"&#39;" }[c])); }
    function icon(name) { return `<svg viewBox="0 0 24 24"><path d="${ICONS[name] || ICONS.email}"/></svg>`; }
    function pin() { return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/></svg>`; }
    function eye() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`; }
    function keySvg() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3"/></svg>`; }

    const profile = loadProfile();
    const authed = sessionStorage.getItem("sv-ok") === "1";
    const admin = isAdminPath();

    function snow(host) {
      const n = Math.min(48, Math.floor(window.innerWidth / 18));
      for (let i = 0; i < n; i++) {
        const f = document.createElement("i");
        f.className = "flake";
        const s = 2 + Math.random() * 4;
        f.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;opacity:${.35+Math.random()*.5};animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*12}s;--drift:${(Math.random()*40-20).toFixed(0)}px`;
        host.appendChild(f);
      }
    }

    function renderProfile() {
      const video = /\.(mp4|webm|ogg)(\?|$)/i.test(profile.background) || profile.background.startsWith("data:video");
      const tracks = (profile.youtubeTracks || []).filter(t => t.videoId || ytId(t.url));
      document.getElementById("app").innerHTML = `
        ${video ? `<video class="bg-video" autoplay muted loop playsinline poster="${esc(profile.poster)}"><source src="${esc(profile.background)}" type="video/mp4"></video>`
                : `<img class="bg-img" src="${esc(profile.background)}" alt="">`}
        <div class="veil"></div><div class="snow" id="snow"></div>
        <main class="wrap">
          <div class="avatar-wrap"><img class="avatar" src="${esc(profile.avatar)}" alt=""></div>
          <div class="name-box"><span class="sparkle a"></span><span class="sparkle b"></span><span class="sparkle c"></span>
            <h1>${esc(profile.displayName)}</h1></div>
          <p class="bio">${esc(profile.description)}</p>
          <p class="loc">${pin()} ${esc(profile.location)}</p>
          <ul class="socials">${profile.socials.map(s => {
            const inner = icon(s.social);
            if (s.mode === "text" || !s.href) return `<li><button type="button" data-copy="${esc(s.value)}" title="${esc(s.label)}">${inner}</button></li>`;
            return `<li><a href="${esc(s.href)}" target="_blank" rel="noopener" title="${esc(s.label)}">${inner}</a></li>`;
          }).join("")}</ul>
          <p class="views">${eye()} <span id="views">—</span></p>
        </main>
        ${tracks.length ? `<div class="player glass" id="player">
          <img class="thumb" id="yt-thumb" alt="">
          <div id="yt-host" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"></div>
          <div class="meta"><p id="yt-title">YouTube</p><span id="yt-sub">tap to play</span></div>
          <div class="ctrls">
            <button type="button" id="yt-prev" ${tracks.length<2?"hidden":""} aria-label="Prev">⏮</button>
            <button type="button" class="play" id="yt-play" aria-label="Play">▶</button>
            <button type="button" id="yt-next" ${tracks.length<2?"hidden":""} aria-label="Next">⏭</button>
          </div>
        </div>` : ""}
        <div class="login-wrap">
          <div id="login-panel" class="login-panel glass" hidden>
            <div class="row" style="justify-content:space-between;margin-bottom:.5rem"><h3>Login with password</h3>
              <button class="icon-btn" id="login-x" style="width:2rem;height:2rem;background:none;border:0">✕</button></div>
            <form id="login-form"><input class="field" type="password" id="pw" placeholder="Password" autocomplete="current-password">
              <p class="err" id="login-err" hidden>Wrong password</p>
              <button class="go" type="submit">Enter</button></form>
          </div>
          <button class="login-btn" id="login-open" aria-label="Login">${keySvg()}</button>
        </div>`;
      snow(document.getElementById("snow"));
      document.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => {
        navigator.clipboard.writeText(btn.dataset.copy).then(() => { btn.title = "Copied"; });
      });
      document.getElementById("login-open").onclick = () => { if (sessionStorage.getItem("sv-ok")==="1") { location.href = "admin.html"; return; } document.getElementById("login-panel").hidden = false; };
      document.getElementById("login-x").onclick = () => document.getElementById("login-panel").hidden = true;
      document.getElementById("login-form").onsubmit = (e) => {
        e.preventDefault();
        if (document.getElementById("pw").value === PASS) { sessionStorage.setItem("sv-ok","1"); location.href = "admin.html"; }
        else document.getElementById("login-err").hidden = false;
      };
      bumpViews();
      if (tracks.length) setupYt(tracks);
      const frames = [profile.displayName, profile.displayName+".", profile.displayName+"..", profile.displayName+"...", "✦ "+profile.displayName];
      let i = 0; setInterval(() => { document.title = frames[i++ % frames.length]; }, 900);
    }

    function renderAdminGate() {
      document.getElementById("app").innerHTML = `
        <div class="veil"></div>
        <div class="admin">
          <div class="card glass" style="max-width:22rem;margin:20vh auto 0">
            <h2>Admin login</h2>
            <form id="gate"><input class="field" type="password" id="pw" placeholder="Password" autofocus>
            <p class="err" id="login-err" hidden>Wrong password</p>
            <button class="save" type="submit">Enter</button></form>
            <p class="tiny" style="margin-top:.75rem"><a href="index.html" style="color:var(--muted)">← back to profile</a></p>
          </div>
        </div>`;
      document.getElementById("gate").onsubmit = (e) => {
        e.preventDefault();
        if (document.getElementById("pw").value === PASS) { sessionStorage.setItem("sv-ok","1"); location.reload(); }
        else document.getElementById("login-err").hidden = false;
      };
    }

    function renderAdmin() {
      const p = profile;
      document.getElementById("app").innerHTML = `
        <div style="min-height:100dvh;background:#0a0a0b">
        <div class="admin">
          <h1>Edit profile</h1>
          <p class="muted" style="margin-bottom:1.2rem">Saved in this browser. Everyone who opens this site sees these values on <b>this computer</b>.</p>
          <form id="ed">
            <div class="card glass">
              <h2>Identity</h2>
              <label><span>Name</span><input class="field" name="displayName" value="${esc(p.displayName)}" maxlength="40"></label>
              <label><span>Bio</span><textarea class="field" name="description" rows="4">${esc(p.description)}</textarea></label>
              <label><span>Location</span><input class="field" name="location" value="${esc(p.location)}"></label>
            </div>
            <div class="card glass">
              <h2>Profile picture</h2>
              <input class="field" name="avatar" value="${esc(p.avatar.startsWith("data:") ? "" : p.avatar)}" placeholder="https://… or media/avatar.gif">
              <input class="field" type="file" accept="image/*" id="avatar-file">
            </div>
            <div class="card glass">
              <h2>Background</h2>
              <input class="field" name="background" value="${esc(p.background.startsWith("data:") ? "" : p.background)}" placeholder="image or mp4 URL">
              <input class="field" type="file" accept="image/*,video/mp4,video/webm" id="bg-file">
            </div>
            <div class="card glass">
              <div class="row" style="justify-content:space-between"><h2>YouTube player</h2>
                <button type="button" class="ghost" id="add-yt">+ Add link</button></div>
              <p class="tiny">Paste YouTube links. They play on the profile.</p>
              <div id="yt-list"></div>
            </div>
            <div class="card glass">
              <div class="row" style="justify-content:space-between"><h2>Socials</h2>
                <button type="button" class="ghost" id="add-soc">+ Add</button></div>
              <div id="soc-list"></div>
            </div>
            <button class="save" type="submit">Save changes</button>
            <p class="tiny" style="margin-top:.8rem;text-align:center"><a href="index.html" style="color:var(--muted)">View profile</a> · <button type="button" id="out" class="ghost">Log out</button></p>
          </form>
        </div></div>`;
      const ytList = document.getElementById("yt-list");
      const socList = document.getElementById("soc-list");
      let tracks = (p.youtubeTracks || []).map(t => ({ ...t }));
      let socials = p.socials.map(s => ({ ...s }));
      function drawYt() {
        ytList.innerHTML = tracks.map((t,i) => `<div class="row" style="margin:.4rem 0"><input class="field" data-yt="${i}" placeholder="https://youtu.be/…" value="${esc(t.url || "")}"><button type="button" class="ghost" data-rmyt="${i}">✕</button></div>`).join("") || `<p class="muted">No tracks yet.</p>`;
        ytList.querySelectorAll("[data-yt]").forEach(el => el.oninput = () => { tracks[+el.dataset.yt].url = el.value; });
        ytList.querySelectorAll("[data-rmyt]").forEach(el => el.onclick = () => { tracks.splice(+el.dataset.rmyt,1); drawYt(); });
      }
      function drawSoc() {
        socList.innerHTML = socials.map((s,i) => `<div style="margin:.6rem 0;padding:.6rem;border:1px solid var(--border);border-radius:.75rem">
          <div class="row">
            <select class="field" data-stype="${i}">${TYPES.map(t => `<option value="${t}" ${t===s.social?"selected":""}>${t}</option>`).join("")}</select>
            <button type="button" class="ghost" data-rmsoc="${i}">✕</button>
          </div>
          <input class="field" data-sval="${i}" placeholder="URL or text" value="${esc(s.href || s.value)}">
        </div>`).join("");
        socList.querySelectorAll("[data-stype]").forEach(el => el.onchange = () => { socials[+el.dataset.stype].social = el.value; socials[+el.dataset.stype].label = el.value; });
        socList.querySelectorAll("[data-sval]").forEach(el => el.oninput = () => {
          const s = socials[+el.dataset.sval]; s.value = el.value; s.href = el.value; s.mode = el.value.startsWith("http") || el.value.startsWith("mailto:") ? "link" : "text";
        });
        socList.querySelectorAll("[data-rmsoc]").forEach(el => el.onclick = () => { socials.splice(+el.dataset.rmsoc,1); drawSoc(); });
      }
      drawYt(); drawSoc();
      document.getElementById("add-yt").onclick = () => { tracks.push({ id: crypto.randomUUID(), url: "", videoId: "", title: "" }); drawYt(); };
      document.getElementById("add-soc").onclick = () => { socials.push({ id: crypto.randomUUID(), social: "discord", label: "Discord", value: "", href: "", mode: "link" }); drawSoc(); };
      document.getElementById("out").onclick = () => { sessionStorage.removeItem("sv-ok"); location.href = "index.html"; };
      const readFile = (file) => new Promise((res, rej) => { if (file.size > 8*1024*1024) return rej("Max 8 MB"); const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      document.getElementById("avatar-file").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; p.avatar = await readFile(f); };
      document.getElementById("bg-file").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; p.background = await readFile(f); p.poster = p.background; };
      document.getElementById("ed").onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        p.displayName = fd.get("displayName") || p.displayName;
        p.description = fd.get("description") ?? p.description;
        p.location = fd.get("location") || p.location;
        const av = fd.get("avatar"); if (av) p.avatar = av;
        const bg = fd.get("background"); if (bg) p.background = bg;
        p.socials = socials;
        p.youtubeTracks = tracks.map(t => { const id = ytId(t.url); return id ? { id: t.id || id, url: "https://www.youtube.com/watch?v="+id, videoId: id, title: t.title || "YouTube" } : null; }).filter(Boolean);
        saveProfile(p);
        alert("Saved. Open the profile to see it.");
      };
    }

    async function bumpViews() {
      const el = document.getElementById("views");
      const k = "sv-views";
      let n = Number(localStorage.getItem(k) || "0") + 1;
      localStorage.setItem(k, String(n));
      try {
        const r = await fetch("https://api.counterapi.dev/v1/shadowedveer/lol/up");
        if (r.ok) { const j = await r.json(); if (typeof j.count === "number") n = j.count; }
      } catch {}
      if (el) el.textContent = n;
    }

    let ytPlayer, ytIndex = 0, ytPlaying = false;
    function setupYt(tracks) {
      const list = tracks.map(t => ({ ...t, videoId: t.videoId || ytId(t.url) })).filter(t => t.videoId);
      const show = (i) => {
        const t = list[i];
        document.getElementById("yt-title").textContent = t.title || "YouTube";
        document.getElementById("yt-sub").textContent = list.length > 1 ? (i+1)+" / "+list.length : "YouTube";
        document.getElementById("yt-thumb").src = "https://i.ytimg.com/vi/"+t.videoId+"/mqdefault.jpg";
      };
      show(0);
      const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => {
        ytPlayer = new YT.Player("yt-host", {
          videoId: list[0].videoId, width: 8, height: 8,
          playerVars: { autoplay: 0, controls: 0, rel: 0, playsinline: 1 },
          events: { onStateChange: (e) => {
            if (e.data === 1) ytPlaying = true;
            if (e.data === 2) ytPlaying = false;
            if (e.data === 0) { ytIndex = (ytIndex + 1) % list.length; show(ytIndex); ytPlayer.loadVideoById(list[ytIndex].videoId); }
            document.getElementById("yt-play").textContent = ytPlaying ? "❚❚" : "▶";
          }}
        });
      };
      const start = () => { ytPlayer && ytPlayer.playVideo(); window.removeEventListener("pointerdown", start); };
      window.addEventListener("pointerdown", start);
      document.getElementById("yt-play").onclick = () => { if (!ytPlayer) return; ytPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); };
      document.getElementById("yt-prev").onclick = () => { ytIndex = (ytIndex - 1 + list.length) % list.length; show(ytIndex); ytPlayer && ytPlayer.loadVideoById(list[ytIndex].videoId); };
      document.getElementById("yt-next").onclick = () => { ytIndex = (ytIndex + 1) % list.length; show(ytIndex); ytPlayer && ytPlayer.loadVideoById(list[ytIndex].videoId); };
    }

    if (admin) {
      if (authed) renderAdmin(); else renderAdminGate();
    } else {
      renderProfile();
    }
  </script>
</body>
</html>
